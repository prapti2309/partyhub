services:
  # 1. Backend Web Service
  - type: web
    name: partyhub-backend
    runtime: node
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npx prisma migrate deploy && npm start
    envVars:
      - key: NODE_ENV
        value: production

      - key: PORT
        value: 10000

      - key: DATABASE_URL
        fromDatabase:
          name: partyhub-db
          property: connectionString

      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: partyhub-redis
          property: connectionString

      - key: JWT_SECRET
        generateValue: true

      - key: JWT_REFRESH_SECRET
        generateValue: true

  # 2. Frontend Web Service
  - type: web
    name: partyhub-frontend
    runtime: node
    rootDir: client
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production

      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: partyhub-backend
          envVarKey: RENDER_EXTERNAL_URL

      - key: NEXT_PUBLIC_SOCKET_URL
        fromService:
          type: web
          name: partyhub-backend
          envVarKey: RENDER_EXTERNAL_URL

  # 3. Redis / Key Value
  - type: keyvalue
    name: partyhub-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

databases:
  # 4. Managed PostgreSQL Database
  - name: partyhub-db
    databaseName: watchparty
    user: partyhub_user
    plan: free