services:
  # 1. Backend Web Service (Express + Socket.IO)
  - type: web
    name: partyhub-backend
    env: node
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npx prisma migrate deploy && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: partyhub-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: partyhub-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true

  # 2. Frontend Web Service (Next.js)
  - type: web
    name: partyhub-frontend
    env: node
    rootDir: client
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: partyhub-backend
          property: url
      - key: NEXT_PUBLIC_SOCKET_URL
        fromService:
          type: web
          name: partyhub-backend
          property: url

databases:
  # 3. Managed PostgreSQL Database
  - name: partyhub-db
    databaseName: watchparty
    user: partyhub_user
    plan: free

# 4. Managed Redis Store
redis:
  - name: partyhub-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
